name: KubeMind CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: |
          cd frontend
          npm ci
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint
      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm run build

  test-and-build-backend:
    name: Backend Java 21 Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile and Run Backend Unit Tests
        run: |
          cd backend
          mvn clean test
      - name: Package Backend Fat JAR
        run: |
          cd backend
          mvn package -DskipTests

  test-python-services:
    name: AI Service & MCP Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            mcp-server/requirements.txt
            ai-service/requirements.txt
      - name: Test MCP Server
        run: |
          cd mcp-server
          pip install --no-cache-dir -r requirements.txt
          python test_mcp_server.py
      - name: Test AI Service
        run: |
          cd ai-service
          pip install --no-cache-dir -r requirements.txt
          python test_ai_service.py

  build-and-package-containers:
    name: Build & Package Container Images
    needs: [test-and-build-frontend, test-and-build-backend, test-python-services]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute Image Tag Metadata
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="sha-${GITHUB_SHA::8}"
          fi
          echo "owner=${REPO_OWNER}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "should_push=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.meta.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Package Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ steps.meta.outputs.should_push == 'true' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kubemind-backend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/kubemind-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Package Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ steps.meta.outputs.should_push == 'true' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kubemind-frontend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/kubemind-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Package AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: ${{ steps.meta.outputs.should_push == 'true' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kubemind-ai-service:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/kubemind-ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Package MCP Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          file: ./mcp-server/Dockerfile
          push: ${{ steps.meta.outputs.should_push == 'true' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kubemind-mcp-server:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/kubemind-mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
