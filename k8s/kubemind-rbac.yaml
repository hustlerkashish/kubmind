apiVersion: v1
kind: Namespace
metadata:
  name: kubemind
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubemind-sa
  namespace: kubemind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemind-reader
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "nodes", "services", "namespaces", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
- nonResourceURLs: ["/version", "/healthz"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemind-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubemind-reader
subjects:
- kind: ServiceAccount
  name: kubemind-sa
  namespace: kubemind
