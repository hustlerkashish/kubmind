apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kubemind
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: kubemind
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: kubemind
    spec:
      serviceAccountName: kubemind-sa
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/hustlerkashish/kubemind-backend:sha-84ccd587
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http-api
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: kubemind-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: kubemind-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: INTERNAL_API_KEY
            - name: KUBEMIND_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: KUBEMIND_SETUP_TOKEN
            - name: KUBEMIND_INITIAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: KUBEMIND_INITIAL_ADMIN_USERNAME
                  optional: true
            - name: KUBEMIND_INITIAL_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: KUBEMIND_INITIAL_ADMIN_EMAIL
                  optional: true
            - name: KUBEMIND_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: KUBEMIND_INITIAL_ADMIN_PASSWORD
                  optional: true
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: kubemind-config
                  key: ALLOWED_ORIGINS
            - name: FRONTEND_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: kubemind-config
                  key: FRONTEND_BASE_URL
            - name: AI_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: kubemind-config
                  key: AI_SERVICE_URL
            - name: MCP_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: kubemind-config
                  key: MCP_SERVER_URL
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: kubemind-config
                  key: PROMETHEUS_URL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kubemind
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: kubemind
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 8080
      targetPort: 8080
      name: http-api
      protocol: TCP
