# ==============================================================================
# KubeMind Production Secrets Template (Template Only - Never commit real keys)
# Copy this file to 03-secrets.yaml and populate with real base64/plain values.
# Apply via: kubectl apply -f k8s/aws-demo/03-secrets.yaml
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: kubemind-secrets
  namespace: kubemind
  labels:
    app.kubernetes.io/name: kubemind-secrets
    app.kubernetes.io/part-of: kubemind
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "kubemind_admin"
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_DATABASE_PASSWORD_MIN_24_CHARS"

  # Spring Security JWT Signing Key (Must be at least 256-bit / 32-byte secret)
  JWT_SECRET: "CHANGE_ME_SECURE_JWT_SECRET_KEY_MINIMUM_32_BYTES_HEX_OR_BASE64_FOR_HMAC256"

  # Internal Service Authentication (Must match across Backend, AI Service, and MCP Server)
  INTERNAL_API_KEY: "CHANGE_ME_INTERNAL_CLUSTER_SHARED_API_KEY_MIN_32_CHARS"

  # One-Time First-Boot Administrator Setup Token (CRIT-02 Secure Bootstrapping)
  KUBEMIND_SETUP_TOKEN: "CHANGE_ME_BOOTSTRAP_SETUP_TOKEN_FOR_FIRST_ADMIN_CREATION"

  # Optional First-Boot Direct Admin Provisioning (Alternative to setup token)
  KUBEMIND_INITIAL_ADMIN_USERNAME: ""
  KUBEMIND_INITIAL_ADMIN_EMAIL: ""
  KUBEMIND_INITIAL_ADMIN_PASSWORD: ""

  # AI LLM Provider Keys
  GROQ_API_KEY: "CHANGE_ME_GROQ_API_KEY"
  GEMINI_API_KEY: ""
