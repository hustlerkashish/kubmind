apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: kubemind
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: kubemind
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/part-of: kubemind
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: ai-service
          image: ghcr.io/kubemind/ai-service:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: INTERNAL_API_KEY
            - name: MCP_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: kubemind-config
                  key: MCP_SERVER_URL
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: GROQ_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: kubemind-config
                  key: DEFAULT_MODEL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: kubemind
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: kubemind
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-service
  ports:
    - port: 8000
      targetPort: 8000
      name: http
      protocol: TCP
