apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: kubemind
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/part-of: kubemind
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/part-of: kubemind
    spec:
      serviceAccountName: kubemind-sa
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: mcp-server
          image: ghcr.io/hustlerkashish/kubemind-mcp-server:sha-84ccd587
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8001
              name: http
              protocol: TCP
          env:
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubemind-secrets
                  key: INTERNAL_API_KEY
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: kubemind-config
                  key: PROMETHEUS_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: kubemind
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/part-of: kubemind
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
    - port: 8001
      targetPort: 8001
      name: http
      protocol: TCP
