apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubemind-sa
  namespace: kubemind
  labels:
    app.kubernetes.io/name: kubemind-sa
    app.kubernetes.io/part-of: kubemind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemind-reader
  labels:
    app.kubernetes.io/name: kubemind-reader
    app.kubernetes.io/part-of: kubemind
rules:
  # Core Kubernetes read-only observability
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "services", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  # Workload read-only observability
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Metric server integration
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Cluster health and version checks
  - nonResourceURLs: ["/version", "/healthz"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemind-reader-binding
  labels:
    app.kubernetes.io/name: kubemind-reader-binding
    app.kubernetes.io/part-of: kubemind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubemind-reader
subjects:
  - kind: ServiceAccount
    name: kubemind-sa
    namespace: kubemind
