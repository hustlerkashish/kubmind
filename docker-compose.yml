services:
  # ---------------------------------------------------------------------------
  # 1. Database Layer: PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: kubemind-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kubemind}
      POSTGRES_USER: ${POSTGRES_USER:-kubemind_admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable is required}"
    # Kept on internal Docker network without host port publication
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kubemind_admin} -d ${POSTGRES_DB:-kubemind}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - kubemind-net

  # ---------------------------------------------------------------------------
  # 2. Backend API Gateway Layer: Spring Boot 3 & Java 21
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kubemind-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kubemind}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kubemind_admin}
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable is required}"

      KUBEMIND_INITIAL_ADMIN_USERNAME: ${KUBEMIND_INITIAL_ADMIN_USERNAME:-}
      KUBEMIND_INITIAL_ADMIN_EMAIL: ${KUBEMIND_INITIAL_ADMIN_EMAIL:-}
      KUBEMIND_INITIAL_ADMIN_PASSWORD: ${KUBEMIND_INITIAL_ADMIN_PASSWORD:-}

      KUBEMIND_SETUP_TOKEN: ${KUBEMIND_SETUP_TOKEN:-}

      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET environment variable is required}"
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      GRAFANA_URL: ${GRAFANA_URL:-}
      GRAFANA_API_KEY: ${GRAFANA_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "kubernetes.docker.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    networks:
      - kubemind-net

  # ---------------------------------------------------------------------------
  # 2b. Metrics Layer: Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: kubemind-prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - kubemind-net

  # ---------------------------------------------------------------------------
  # 3. Model Context Protocol (MCP) Server: Python FastAPI (Private Network)
  # ---------------------------------------------------------------------------
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: kubemind-mcp-server
    restart: always
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080/api/v1
      PORT: 8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - kubemind-net

  # ---------------------------------------------------------------------------
  # 4. AI Subsystem Microservice: Python FastAPI
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: kubemind-ai-service
    restart: always
    environment:
      PORT: 8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      MCP_API_KEY: ${INTERNAL_API_KEY:-}
      MCP_SERVER_URL: http://mcp-server:8001/mcp/call
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    networks:
      - kubemind-net

  # ---------------------------------------------------------------------------
  # 5. Frontend Command Center Interface: React 19 & Vite (Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kubemind-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - kubemind-net

volumes:
  postgres_data:

networks:
  kubemind-net:
    driver: bridge
