spring:
  application:
    name: kubemind-backend
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  setup:
    token: ${KUBEMIND_SETUP_TOKEN:}
  initial-admin:
    username: ${KUBEMIND_INITIAL_ADMIN_USERNAME:}
    email: ${KUBEMIND_INITIAL_ADMIN_EMAIL:}
    password: ${KUBEMIND_INITIAL_ADMIN_PASSWORD:}
  prometheus:
    url: ${PROMETHEUS_URL:http://prometheus-server:80}

github:
  token: ${GITHUB_TOKEN:}
  repos: ${GITHUB_REPOS:}

grafana:
  url: ${GRAFANA_URL:}
  api-key: ${GRAFANA_API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
